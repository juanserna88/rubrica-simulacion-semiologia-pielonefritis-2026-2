  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

px;width:auto;display:block\">\n<div style=\"color:#1f3a5f\"><div style=\"font-weight:700;letter-spacing:.05em;font-size:13px\">FACULTAD DE CIENCIAS DE LA SALUD · CESCUM<\u002Fdiv><div style=\"font-size:22px;font-weight:700;line-height:1.15\">Rúbrica de evaluación — Pielonefritis<\u002Fdiv><div style=\"font-size:14px;color:#56606d\">Examen basado en simulación clínica · Semiología abdominal y genitourinaria<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<img src=\"62afaf24-c880-46dd-856f-de75c91e140a\" alt=\"Acreditación Institucional de Alta Calidad\" style=\"height:40px;width:auto;display:block\">\n<\u002Fdiv>\n\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px\">\n<label style=\"display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:#56606d\">Nombre<input value=\"{{ student }}\" sc-camel-on-change=\"{{ onStudent }}\" placeholder=\"Nombre completo del estudiante\" style=\"padding:9px 10px;border:1px solid #c9d0da;border-radius:6px;background:#fff;color:#1d232b\"><\u002Flabel>\n<label style=\"display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:#56606d\">Código<input value=\"{{ code }}\" sc-camel-on-change=\"{{ onCode }}\" style=\"padding:9px 10px;border:1px solid #c9d0da;border-radius:6px;background:#fff;color:#1d232b\"><\u002Flabel>\n<label style=\"display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:#56606d\">Fecha<input type=\"date\" value=\"{{ date }}\" sc-camel-on-change=\"{{ onDate }}\" style=\"padding:8px 10px;border:1px solid #c9d0da;border-radius:6px;background:#fff;color:#1d232b\"><\u002Flabel>\n<\u002Fdiv>\n\n<div style=\"position:sticky;top:0;z-index:5;background:#1f3a5f;color:#fff;border-radius:10px;padding:14px 18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px 24px;align-items:center\">\n<div style=\"display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:120px\">\n<div style=\"font-size:12px;letter-spac tyle=\"font-weight:600;color:#56606d;font-size:14px\">· 33,3 %<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:10px;align-items:center\">\n<button data-noprint=\"\" sc-camel-on-click=\"{{ c.allYes }}\" style=\"padding:5px 10px;border:1px solid #c9d0da;background:#fff;border-radius:6px;font-size:13px;cursor:pointer;color:#1f3a5f\">Todo Sí<\u002Fbutton>\n<span style=\"font-size:15px\"><strong>{{ c.scoreTxt }}<\u002Fstrong> / 1,67<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ c.groups }}\" as=\"g\" hint-placeholder-count=\"1\">\n<div>\n<sc-if value=\"{{ g.name }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"padding:8px 16px 4px;font-size:12px;letter-spacing:.08em;font-weight:700;color:#56606d\">{{ g.name }}<\u002Fdiv><\u002Fsc-if>\n<sc-for list=\"{{ g.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 16px;border-top:1px solid #edf0f4;background:{{ it.rowBg }}\">\n<div style=\"display:flex;flex-direction:column;gap:2px\">\n<div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\"><span style=\"font-weight:600\">{{ it.label }}<\u002Fspan><sc-if value=\"{{ it.plus }}\"><span style=\"display:inline-block;padding:1px 7px;border-radius:3px;background:#1f3a5f;color:#fff;font-size:11px;font-weight:700\">PLUS Δ<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n<sc-if value=\"{{ it.hint }}\"><div style=\"font-size:13px;color:#56606d\">{{ it.hint }}<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"display:flex;gap:6px\">\n<button sc-camel-on-click=\"{{ it.setYes }}\" style=\"min-width:56px;padding:7px 12px;border-radius:6px;border:1.5px solid {{ it.yesBd }};background:{{ it.yesBg }};color:{{ it.yesFg }};font-weight:700;font-size:14px;cursor:pointer\">Sí<\u002Fbutton>\n<button sc-camel-on-click=\"{{ it.setNo }}\" style=\"min-width:56px;padding:7px 12px;border-radius:6px;border:1.5px solid {{ it.noBd }};background:{{ it.noBg }};color:{{ it.noFg }};fon umn;gap:4px;font-size:12px;font-weight:700;letter-spacing:.04em;color:#56606d\">URL DEL GOOGLE APPS SCRIPT (WEB APP)<input value=\"{{ scriptUrl }}\" sc-camel-on-change=\"{{ onScriptUrl }}\" placeholder=\"https://script.google.com/macros/s/…/exec\" style=\"padding:9px 10px;border:1px solid #c9d0da;border-radius:6px;background:#fff;color:#1d232b;font-weight:400;letter-spacing:0\"><\u002Flabel>\n<label style=\"display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;letter-spacing:.04em;color:#56606d\">COPIA AL CORREO DEL EVALUADOR<input type=\"email\" value=\"{{ ccEmail }}\" sc-camel-on-change=\"{{ onCcEmail }}\" placeholder=\"docente@umanizales.edu.co\" style=\"padding:9px 10px;border:1px solid #c9d0da;border-radius:6px;background:#fff;color:#1d232b;font-weight:400;letter-spacing:0\"><\u002Flabel>\n<label style=\"display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;letter-spacing:.04em;color:#56606d\">ID DE LA GOOGLE SHEET (MATRIZ DE NOTAS)<input value=\"{{ sheetId }}\" sc-camel-on-change=\"{{ onSheetId }}\" placeholder=\"ID de la hoja de cálculo\" style=\"padding:9px 10px;border:1px solid #c9d0da;border-radius:6px;background:#fff;color:#1d232b;font-weight:400;letter-spacing:0\"><\u002Flabel>\n<label style=\"display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;letter-spacing:.04em;color:#56606d\">CORREO DEL ESTUDIANTE (DESTINATARIO)<input type=\"email\" value=\"{{ studentEmail }}\" sc-camel-on-change=\"{{ onStudentEmail }}\" placeholder=\"estudiante@umanizales.edu.co\" style=\"padding:9px 10px;border:1px solid #c9d0da;border-radius:6px;background:#fff;color:#1d232b;font-weight:400;letter-spacing:0\"><\u002Flabel>\n<\u002Fdiv>\n<div style=\"display:flex;gap:12px;flex-wrap:wrap;align-items:center\">\n<button sc-camel-on-click=\"{{ onSend }}\" disabled=\"{{ sending }}\" style=\"padding:12px 22px;border-radius:6px;border:none;background:#2f7d4f;color:#fff;font-weight:700;font-size:15px;letter-spacing:.03em;cursor:pointer\">{{ sendLabel }}<\u002Fbutton>\n<button sc-camel-on-click=\"{{ onPrint }}\" style=\"padding:11px 22px;border-radius:6px;border:1.5px solid #1d232b;background:#fff;color:#1d232b;font-weight:700;font-size:15px;letter-spacing:.03em;cursor:pointer\">DESCARGAR PDF<\u002Fbutton>\n<button sc-camel-on-click=\"{{ onReset }}\" style=\"padding:4px;border:none;background:none;color:#56606d;font-size:14px;text-decoration:underline;cursor:pointer\">Limpiar puntajes<\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{ sendMsg }}\"><div style=\"font-size:14px;font-weight:600;color:{{ sendMsgColor }}\">{{ sendMsg }}<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n\n<div style=\"font-size:13px;color:#56606d;border-top:1px solid #c9d0da;padding-top:10px\">Cálculo: cada componente vale 1,67 (33,3 % de 5,0). Puntaje del componente = (ítems logrados ÷ ítems del componente) × 1,67. Ítems sin marcar cuentan como No. Nota mínima 0,0 · máxima 5,0.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;plusMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Bonificación (tope)&quot;,&quot;Incluido en el total&quot;],&quot;default&quot;:&quot;Bonificación (tope)&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Puntaje&quot;},&quot;passMark&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:3.0,&quot;min&quot;:0,&quot;max&quot;:5,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Puntaje&quot;}}\">\nconst KEY = 'rubrica-pielonefritis-v1';\nconst DEF_URL = 'https://script.google.com/macros/s/AKfycbzn5wOkOrjAFjHnJpeE9nQYWITD7kV7-kM1Ay4N1bo11m217M-l1y8a94munxLYcC9fTg/exec';\nconst DEF_SHEET = '1rJnP8ALP18iCl49ScE55mGg2OufrbrHzB1h7SI_j47I';\nconst COMPS = [\n  { id: 'a', title: 'Anamnesis', groups: [\n    { name: 'DOLOR', items: [\n      ['a1', 'Pregunta por la sublocalización del dolor en abdomen', 'Lumbar derecho / flanco'],\n      ['a2', 'Pregunta por el tipo de dolor', 'Cólico'],\n      ['a3', 'Pregunta por la intensidad', 'Moderada a severa'],\n      ['a4', 'Pregunta por la irradiación', 'Irradiado a flanco'],\n    ]},\n    { name: 'FIEBRE', items: [\n      ['a5', 'Pregunta por fiebre subjetiva', ''],\n      ['a6', 'Pregunta si fue cuantificada', 'No cuantificada'],\n      ['a7', 'Pregunta por el predominio', 'Continua'],\n    ]},\n    { name: 'SÍNTOMAS URINARIOS IRRITATIVOS', items: [\n      ['a8', 'Polaquiuria', ''],\n      ['a9', 'Poliuria', ''],\n      ['a10', 'Hematuria', ''],\n      ['a11', 'Tenesmo vesical', ''],\n      ['a12', 'Urgencia miccional', ''],\n    ]},\n  ]},\n  { id: 'e', title: 'Examen físico', groups: [\n    { name: 'INSPECCIÓN', items: [\n      ['e1', 'Verbaliza datos de la inspección', 'Forma del abdomen, cicatrices, piel'],\n    ]},\n    { name: 'AUSCULTACIÓN', items: [\n      ['e3', 'Ausculta el abdomen antes de palpar', 'Ruidos intestinales'],\n    ]},\n    { name: 'PALPACIÓN', items: [\n      ['e4', 'Palpación superficial', ''],\n      ['e6', 'Palpación profunda: punto pieloureteral superior — verbaliza ubicación', 'Línea umbilical, borde externo del recto abdominal'],\n      ['e7', 'Palpación profunda: punto pieloureteral medio — verbaliza ubicación', 'Línea biespinosa, unión tercio medio con tercio externo'],\n    ]},\n    { name: 'MANIOBRAS RENALES', items: [\n      ['e8', 'Signo de Giordano', 'Puñopercusión lumbar', true],\n      ['e9', 'Signo de Guyon', 'Peloteo renal / palpación bimanual', true],\n    ]},\n  ]},\n  { id: 'd', title: 'Impresión diagnóstica', groups: [\n    { name: '', items: [\n      ['d1', 'IVU', ''],\n      ['d2', 'Alta tipo pielonefritis', ''],\n    ]},\n  ]},\n];\nconst W = 5 / 3;\nconst fmt = n => n.toFixed(2).replace('.', ',');\n\nclass Component extends DCLogic {\n  state = { marks: {}, student: '', code: '', evaluator: '', date: new Date().toISOString().slice(0, 10), notes: '' };\n  componentDidMount() {\n    try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) this.setState(s); } catch (e) {}\n    try { const c = JSON.parse(localStorage.getItem(KEY + '-cfg')); if (c) this.setState(c); } catch (e) {}\n  }\n  componentDidUpdate() {\n    const { scriptUrl, ccEmail, sheetId, sending, sendMsg, sendOk, ...rest } = this.state;\n    try { localStorage.setItem(KEY, JSON.stringify(rest)); localStorage.setItem(KEY + '-cfg', JSON.stringify({ scriptUrl, ccEmail, sheetId })); } catch (e) {}\n  }\n  async send(vals) {\n    const s = this.state;\n    s.scriptUrl = s.scriptUrl || DEF_URL; s.sheetId = s.sheetId || DEF_SHEET; s.ccEmail = s.ccEmail ?? 'jd.serna@umanizales.edu.co';\n    if (!s.scriptUrl) return this.setState({ sendMsg: 'Falta la URL del Google Apps Script.', sendOk: false });\n    if (!s.studentEmail) return this.setState({ sendMsg: 'Falta el correo del estudiante.', sendOk: false });\n    const items = [];\n    COMPS.forEach(c => c.groups.forEach(g => g.items.forEach(([id, label, , plus]) => items.push({ componente: c.title, grupo: g.name, item: label, plusDelta: !!plus, resultado: s.marks[id] === 'si' ? 'Sí' : 'No' }))));\n    const payload = {\n      escenario: 'Pielonefritis — Semiología abdominal y genitourinaria',\n      sheetId: s.sheetId, to: s.studentEmail, cc: s.ccEmail,\n      estudiante: s.student, codigo: s.code, correoEstudiante: s.studentEmail, evaluador: [vals.evaluator1, vals.evaluator2].filter(Boolean).join(' · '), fecha: s.date,\n      anamnesis: vals.comps[0].scoreTxt, examenFisico: vals.comps[1].scoreTxt, impresionDiagnostica: vals.comps[2].scoreTxt,\n      notaFinal: vals.total, estado: vals.status, observaciones: s.notes, items,\n    };\n    this.setState({ sending: true, sendMsg: '' });\n    try {\n      await fetch(s.scriptUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });\n      this.setState({ sending: false, sendOk: true, sendMsg: `Resultado enviado a ${s.studentEmail}${s.ccEmail ? ' (copia a ' + s.ccEmail + ')' : ''}.` });\n    } catch (e) {\n      this.setState({ sending: false, sendOk: false, sendMsg: 'No se pudo enviar: ' + e.message });\n    }\n  }\n  mark(id, v) { this.setState(s => ({ marks: { ...s.marks, [id]: s.marks[id] === v ? undefined : v } })); }\n  field(k) { return e => this.setState({ [k]: e.target.value }); }\n  renderVals() {\n    const bonus = (this.props.plusMode ?? 'Bonificación (tope)') !== 'Incluido en el total';\n    const pass = this.props.passMark ?? 3.0;\n    const m = this.state.marks;\n    let total = 0;\n    const comps = COMPS.map((c, ci) => {\n      const all = c.groups.flatMap(g => g.items);\n      const base = all.filter(i => !i[3]), plus = all.filter(i => i[3]);\n      const yb = base.filter(i => m[i[0]] === 'si').length, yp = plus.filter(i => m[i[0]] === 'si').length;\n      const answered = all.filter(i => m[i[0]]).length;\n      const ratio = bonus ? Math.min(yb + yp, base.length) / base.length : (yb + yp) / all.length;\n      const score = ratio * W; total += score;\n      return {\n        num: ci + 1, title: c.title, scoreTxt: fmt(score), pct: (ratio * 100).toFixed(0) + '%',\n        countTxt: `${yb + yp} logrados · ${answered}/${all.length} evaluados`,\n        allYes: () => this.setState(s => { const mk = { ...s.marks }; all.forEach(i => mk[i[0]] = 'si'); return { marks: mk }; }),\n        groups: c.groups.map(g => ({ name: g.name, items: g.items.map(([id, label, hint, isPlus]) => {\n          const v = m[id];\n          return { label, hint, plus: !!isPlus,\n            rowBg: v === 'si' ? '#f1f8f3' : v === 'no' ? '#fcf3f2' : '#fff',\n            yesBg: v === 'si' ? '#2f7d4f' : '#fff', yesFg: v === 'si' ? '#fff' : '#2f7d4f', yesBd: v === 'si' ? '#2f7d4f' : '#b9d6c3',\n            noBg: v === 'no' ? '#b23b3b' : '#fff', noFg: v === 'no' ? '#fff' : '#b23b3b', noBd: v === 'no' ? '#b23b3b' : '#e3bcb8',\n            setYes: () => this.mark(id, 'si'), setNo: () => this.mark(id, 'no') };\n        }) })),\n      };\n    });\n    total = Math.round(total * 100) / 100;\n    const ok = total >= pass;\n    const out = {\n      scriptUrl: this.state.scriptUrl || DEF_URL, ccEmail: this.state.ccEmail ?? 'jd.serna@umanizales.edu.co', sheetId: this.state.sheetId || DEF_SHEET, studentEmail: this.state.studentEmail ?? '',\n      onScriptUrl: this.field('scriptUrl'), onCcEmail: this.field('ccEmail'), onSheetId: this.field('sheetId'), onStudentEmail: this.field('studentEmail'),\n      sending: !!this.state.sending, sendLabel: this.state.sending ? 'ENVIANDO…' : 'ENVIAR RESULTADO POR EMAIL',\n      sendMsg: this.state.sendMsg || '', sendMsgColor: this.state.sendOk ? '#2f7d4f' : '#b23b3b',\n      comps, total: fmt(total), status: ok ? 'APROBADO' : 'NO APROBADO', statusBg: ok ? '#2f7d4f' : '#b23b3b',\n      plusNote: bonus\n        ? 'Ítems Plus Δ: suman como bonificación dentro del Examen físico y compensan omisiones, con tope de 1,67 en el componente.'\n        : 'Ítems Plus Δ: incluidos en el total del Examen físico (necesarios para alcanzar el máximo).',\n      evaluator1: this.state.evaluator1 ?? 'Juan David Serna Zuluaga', evaluator2: this.state.evaluator2 ?? 'Félix Peláez',\n      onEvaluator1: this.field('evaluator1'), onEvaluator2: this.field('evaluator2'),\n      student: this.state.student, code: this.state.code, date: this.state.date, notes: this.state.notes,\n      onStudent: this.field('student'), onCode: this.field('code'), onEvaluator: this.field('evaluator'), onDate: this.field('date'), onNotes: this.field('notes'),\n      onPrint: () => window.print(),\n      onReset: () => { if (confirm('¿Limpiar la rúbrica para un nuevo estudiante?')) this.setState({ marks: {}, student: '', code: '', notes: '', studentEmail: '', sendMsg: '' }); },\n    };\n    out.onSend = () => this.send(out);\n    return out;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
